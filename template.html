<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DrinkUp!</title>

<!-- Bootstrap 5 via jsDelivr -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Cinzel:wght@600;700&family=MedievalSharp&family=Special+Elite&family=Bebas+Neue&family=Oswald:wght@500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

<!-- Theme variables (base + specialty color themes) -->
<link href="themes/base.css" rel="stylesheet">
<link href="themes/luxury-bar/luxury-bar.css" rel="stylesheet">
<link href="themes/fantasy-tavern/fantasy-tavern.css" rel="stylesheet">
<link href="themes/dive-bar/dive-bar.css" rel="stylesheet">
<link href="themes/liquor-store/liquor-store.css" rel="stylesheet">
<link href="themes/brewery/brewery.css" rel="stylesheet">
<link href="themes/micro-brewery/micro-brewery.css" rel="stylesheet">

<!-- Layout & component styles -->
<link href="styles/main.css" rel="stylesheet">

</head>
<body>

<div class="ambient-layer" id="ambientLayer" aria-hidden="true"></div>

<!-- ============ TOP BAR (injected by scripts/topbar.js) ============ -->
<div id="topbar-root"></div>

<footer>
  <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
    <span>DrinkUp! — built with Bootstrap 5 · rendered from JSON</span>
    <span>© 2026</span>
  </div>
</footer>

<!-- ============ GAME DETAIL MODAL (carousel) ============ -->
<div class="modal fade" id="gameModal" tabindex="-1" aria-hidden="true" aria-labelledby="gameModalLabel">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header border-0">
        <span id="gameModalLabel" class="visually-hidden">Game details</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <div id="gameCarousel" class="carousel slide" data-bs-touch="true">
          <div class="carousel-inner" id="gameCarouselInner"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#gameCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous game</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#gameCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next game</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS via jsDelivr -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Game data, then utilities, then behavior, then init -->
<script defer src="GameData/games.js"></script>
<script defer src="scripts/utils.js"></script>
<script defer src="scripts/topbar.js"></script>
<script defer src="scripts/theme.js"></script>
<script defer src="scripts/render.js"></script>
<script defer src="scripts/app.js"></script>

</body>
</html>
